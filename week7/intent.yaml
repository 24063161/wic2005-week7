# intent.yaml: desired VLAN and ACL state for student ...3161 (10.61.0.0/16).
# VLAN 1 belongs to the API and is left untouched by sync.py.

student_id_last4: "3161"

vlans:
  - {id: 10, name: staff}
  - {id: 20, name: servers}
  - {id: 30, name: guests}
  - {id: 40, name: mgmt}
  - {id: 50, name: voice}
  - {id: 60, name: iot}
  - {id: 70, name: dmz}

acl:
