  - {action: permit, src: 10.61.10.0/24, dst: 10.61.20.0/24, protocol: tcp, port: 443, description: staff-servers-https}
  - {action: permit, src: 10.61.50.0/24, dst: 10.61.20.0/24, protocol: udp, port: 5060, description: voice-sip}
  - {action: permit, src: 10.61.0.0/16, dst: 10.61.70.0/24, protocol: tcp, port: 80, description: internal-dmz-http}
